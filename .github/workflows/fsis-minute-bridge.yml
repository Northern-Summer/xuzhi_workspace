name: FSIS minute bridge

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - fsis-data
    paths:
      - "fsis-bridge/**"
      - ".github/workflows/fsis-minute-bridge.yml"
      - "bridge/request.json"
  schedule:
    - cron: "*/5 1-7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: fsis-minute-bridge
  cancel-in-progress: false

env:
  DATA_BRANCH: fsis-data

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download bridge fetcher
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/Northern-Summer/xuzhi_workspace/master/fsis-bridge/fetch_minute.py \
            --output fetch_minute.py

      - name: Load FSIS runtime request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ env.DATA_BRANCH }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          branch = os.environ["BRANCH"]
          url = f"https://api.github.com/repos/{repo}/contents/bridge/request.json?ref={branch}"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "FSIS-Minute-Bridge/1.5",
          })

          DEFAULT_ID = "default-core"
          symbols = []
          request_id = DEFAULT_ID
          request_state = "DEFAULT"
          reason = "no request"
          spec = {}

          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  body = json.loads(r.read().decode("utf-8"))
              raw = base64.b64decode(body["content"]).decode("utf-8")
              spec = json.loads(raw)
          except Exception as exc:
              reason = f"request fetch/parse failed: {exc!r}"

          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          expires = spec.get("expires_at_bj") if isinstance(spec, dict) else None
          expired = False
          if expires:
              try:
                  expired = datetime.fromisoformat(expires) <= now
              except Exception:
                  expired = True
                  reason = f"invalid expires_at_bj: {expires!r}"

          raw_symbols = spec.get("symbols") if isinstance(spec, dict) else None
          if isinstance(raw_symbols, list):
              seen = set()
              for item in raw_symbols:
                  value = str(item).strip()
                  if value and value not in seen:
                      seen.add(value)
                      symbols.append(value)

          if symbols and not expired and len(symbols) <= 25:
              request_id = str(spec.get("request_id") or DEFAULT_ID)
              request_state = "REQUEST"
              reason = "valid runtime request"
          else:
              symbols = []
              request_id = DEFAULT_ID
              request_state = "DEFAULT"
              if expired:
                  reason = "runtime request expired"
              elif raw_symbols and len(symbols) > 25:
                  reason = f"runtime request exceeds 25-symbol cap: {len(symbols)}"
              elif not symbols and reason == "no request":
                  reason = "runtime request contains no usable symbols"

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              if symbols:
                  f.write("FSIS_SYMBOLS=" + ",".join(symbols) + "\n")
              f.write("FSIS_REQUEST_ID=" + request_id + "\n")
              f.write("FSIS_REQUEST_STATE=" + request_state + "\n")
              f.write("FSIS_REQUEST_REASON=" + reason.replace("\n", " ") + "\n")
          print(json.dumps({
              "request_id": request_id,
              "request_state": request_state,
              "symbol_count": len(symbols) if symbols else "default",
              "reason": reason,
          }, ensure_ascii=False))
          PY

      - name: Fetch 1m market data
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 fetch_minute.py

      - name: Publish bridge snapshot safely
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ env.DATA_BRANCH }}
          REQUEST_STATE: ${{ env.FSIS_REQUEST_STATE }}
          REQUEST_REASON: ${{ env.FSIS_REQUEST_REASON }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          from datetime import datetime, timezone

          repo = os.environ["REPO"]
          branch = os.environ["BRANCH"]
          token = os.environ["GH_TOKEN"]

          with open("bridge/status.json", "r", encoding="utf-8") as f:
              status = json.load(f)

          def api(method, path, payload=None):
              url = f"https://api.github.com/repos/{repo}/contents/{path}?ref={urllib.parse.quote(branch)}"
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "FSIS-Minute-Bridge/1.5",
              }
              body = None
              if payload is not None:
                  body = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return json.loads(r.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  if e.code == 404 and method == "GET":
                      return None
                  detail = e.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API {method} {path} -> {e.code}: {detail}")

          def publish(path, message):
              with open(path, "rb") as f:
                  raw = f.read()
              encoded = base64.b64encode(raw).decode("ascii")
              current = api("GET", path)
              payload = {"message": message, "content": encoded, "branch": branch}
              if current and current.get("sha"):
                  payload["sha"] = current["sha"]
              result = api("PUT", path, payload)
              print(json.dumps({"path": path, "commit": result.get("commit", {}).get("sha")}, ensure_ascii=False))

          status.update({
              "request_state": os.environ.get("REQUEST_STATE"),
              "request_reason": os.environ.get("REQUEST_REASON"),
              "published_at_utc": datetime.now(timezone.utc).isoformat(),
              "last_good_snapshot_updated": False,
          })

          if status.get("status") == "OK" and status.get("live_eligible"):
              # Only verified snapshots may replace the last-known-good market data.
              publish("bridge/latest.json", "FSIS bridge: refresh verified minute snapshot")
              status["last_good_snapshot_updated"] = True
          else:
              # Failed/partial snapshots NEVER overwrite latest.json.
              # Publish status.json only, explicitly marking live data as constrained.
              status["last_good_snapshot_updated"] = False

          with open("bridge/status.publish.json", "w", encoding="utf-8") as f:
              json.dump(status, f, ensure_ascii=False, indent=2)
          publish("bridge/status.json", "FSIS bridge: publish current data status")

          if status.get("status") != "OK" or not status.get("live_eligible"):
              raise SystemExit(f"Bridge data is not live-eligible: {status}")
          PY

      - name: Verify published bridge status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ env.DATA_BRANCH }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          repo=os.environ["REPO"]
          branch=os.environ["BRANCH"]
          token=os.environ["GH_TOKEN"]
          url=f"https://api.github.com/repos/{repo}/contents/bridge/status.json?ref={branch}"
          req=urllib.request.Request(url,headers={
              "Authorization":f"Bearer {token}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"FSIS-Minute-Bridge/1.5",
          })
          with urllib.request.urlopen(req,timeout=20) as r:
              body=json.loads(r.read().decode("utf-8"))
          raw=base64.b64decode(body["content"]).decode("utf-8")
          status=json.loads(raw)
          print(json.dumps(status,ensure_ascii=False,indent=2))
          if status.get("status") != "OK" or not status.get("live_eligible") or not status.get("last_good_snapshot_updated"):
              raise SystemExit(1)
          PY
