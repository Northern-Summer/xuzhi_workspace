name: FSIS minute bridge

on:
  workflow_dispatch:
  push:
    paths:
      - "fsis-bridge/**"
      - ".github/workflows/fsis-minute-bridge.yml"
      - "bridge/request.json"
  schedule:
    - cron: "*/5 1-7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: fsis-minute-bridge
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download bridge fetcher
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/Northern-Summer/xuzhi_workspace/master/fsis-bridge/fetch_minute.py \
            --output fetch_minute.py

      - name: Load FSIS runtime request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/contents/bridge/request.json?ref=fsis-data"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "FSIS-Minute-Bridge/1.3",
          })
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  body = json.loads(r.read().decode("utf-8"))
              raw = base64.b64decode(body["content"]).decode("utf-8")
              spec = json.loads(raw)
          except Exception as exc:
              print(f"No usable request.json; using default universe: {exc}")
              spec = {}

          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          expires = spec.get("expires_at_bj")
          try:
              expired = bool(expires) and datetime.fromisoformat(expires) <= now
          except Exception:
              expired = True if expires else False

          symbols = spec.get("symbols") if isinstance(spec.get("symbols"), list) else []
          symbols = [str(s).strip() for s in symbols if str(s).strip()]
          request_id = str(spec.get("request_id") or "default-core")

          if expired or not symbols:
              symbols = []
              request_id = "default-core"
              print("Using bridge default universe")
          else:
              print(f"Using FSIS request {request_id}: {len(symbols)} symbols")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("FSIS_SYMBOLS=" + ",".join(symbols) + "\n")
              f.write("FSIS_REQUEST_ID=" + request_id + "\n")
          PY

      - name: Fetch 1m market data
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 fetch_minute.py

      - name: Publish bridge snapshot via GitHub Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: fsis-data
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPO"]
          branch = os.environ["BRANCH"]
          token = os.environ["GH_TOKEN"]

          def api(method, path, payload=None):
              url = f"https://api.github.com/repos/{repo}/contents/{path}?ref={urllib.parse.quote(branch)}"
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "FSIS-Minute-Bridge/1.3",
              }
              body = None
              if payload is not None:
                  body = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return json.loads(r.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  if e.code == 404 and method == "GET":
                      return None
                  detail = e.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API {method} {path} -> {e.code}: {detail}")

          def publish(path, message):
              with open(path, "rb") as f:
                  raw = f.read()
              encoded = base64.b64encode(raw).decode("ascii")
              current = api("GET", path)
              payload = {"message": message, "content": encoded, "branch": branch}
              if current and current.get("sha"):
                  payload["sha"] = current["sha"]
              result = api("PUT", path, payload)
              print(json.dumps({"path": path, "commit": result.get("commit", {}).get("sha")}, ensure_ascii=False))

          publish("bridge/latest.json", "FSIS bridge: refresh minute snapshot")
          publish("bridge/status.json", "FSIS bridge: refresh minute status")
          PY

      - name: Verify published bridge status
        run: |
          python3 - <<'PY'
          import json
          with open("bridge/status.json", "r", encoding="utf-8") as f:
              status = json.load(f)
          print(json.dumps(status, ensure_ascii=False, indent=2))
          if status.get("status") != "OK":
              raise SystemExit(1)
          if not status.get("live_eligible"):
              raise SystemExit(1)
          PY
