name: FSIS minute bridge

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - fsis-data
    paths:
      - "fsis-bridge/**"
      - ".github/workflows/fsis-minute-bridge.yml"
      - "bridge/request.json"
  schedule:
    - cron: "*/5 1-7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: fsis-minute-bridge
  cancel-in-progress: true

env:
  DATA_BRANCH: fsis-data
  PYTHONUNBUFFERED: "1"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download bridge runtime
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/Northern-Summer/xuzhi_workspace/master/fsis-bridge/fetch_minute.py \
            --output fetch_minute.py
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/Northern-Summer/xuzhi_workspace/master/fsis-bridge/publish_bridge.py \
            --output publish_bridge.py
          python3 -m py_compile fetch_minute.py publish_bridge.py

      - name: Load FSIS runtime request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ env.DATA_BRANCH }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          branch = os.environ["BRANCH"]
          url = f"https://api.github.com/repos/{repo}/contents/bridge/request.json?ref={branch}"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "FSIS-Minute-Bridge/2.0",
          })

          symbols = []
          request_id = "default-core"
          request_state = "DEFAULT"
          reason = "no request"
          spec = {}
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  body = json.loads(r.read().decode("utf-8"))
              raw = base64.b64decode(body["content"]).decode("utf-8")
              spec = json.loads(raw)
          except Exception as exc:
              reason = f"request fetch/parse failed: {exc!r}"

          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          expires = spec.get("expires_at_bj") if isinstance(spec, dict) else None
          expired = False
          if expires:
              try:
                  expired = datetime.fromisoformat(expires) <= now
              except Exception:
                  expired = True
                  reason = f"invalid expires_at_bj: {expires!r}"

          raw_symbols = spec.get("symbols") if isinstance(spec, dict) else None
          if isinstance(raw_symbols, list):
              for item in raw_symbols:
                  value = str(item).strip()
                  if value and value not in symbols:
                      symbols.append(value)

          if symbols and not expired and len(symbols) <= 25:
              request_id = str(spec.get("request_id") or "default-core")
              request_state = "REQUEST"
              reason = "valid runtime request"
          else:
              symbols = []
              request_id = "default-core"
              request_state = "DEFAULT"
              if expired:
                  reason = "runtime request expired"
              elif raw_symbols and len(raw_symbols) > 25:
                  reason = f"runtime request exceeds 25-symbol cap: {len(raw_symbols)}"
              elif not symbols:
                  reason = reason if reason != "no request" else "runtime request contains no usable symbols"

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("FSIS_SYMBOLS=" + ",".join(symbols) + "\n")
              f.write("FSIS_REQUEST_ID=" + request_id + "\n")
              f.write("FSIS_REQUEST_STATE=" + request_state + "\n")
              f.write("FSIS_REQUEST_REASON=" + reason.replace("\n", " ") + "\n")
          print(json.dumps({
              "request_id": request_id,
              "request_state": request_state,
              "symbol_count": len(symbols) if symbols else "default",
              "reason": reason,
          }, ensure_ascii=False))
          PY

      - name: Fetch 1m market data
        run: python3 fetch_minute.py

      - name: Publish snapshot and status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ env.DATA_BRANCH }}
          REQUEST_STATE: ${{ env.FSIS_REQUEST_STATE }}
          REQUEST_REASON: ${{ env.FSIS_REQUEST_REASON }}
        run: python3 publish_bridge.py

      - name: Verify published status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ env.DATA_BRANCH }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.request
          repo = os.environ["REPO"]
          branch = os.environ["BRANCH"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/contents/bridge/status.json?ref={branch}"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "FSIS-Minute-Bridge/2.0",
          })
          with urllib.request.urlopen(req, timeout=20) as r:
              body = json.loads(r.read().decode("utf-8"))
          status = json.loads(base64.b64decode(body["content"]).decode("utf-8"))
          print(json.dumps(status, ensure_ascii=False, indent=2))
          if status.get("status") not in {"OK", "PARTIAL_FAILURE", "FAILED"}:
              raise SystemExit("invalid bridge status")
          if "published_at_utc" not in status:
              raise SystemExit("published status missing timestamp")
          if status.get("status") == "OK" and not status.get("last_good_snapshot_updated"):
              raise SystemExit("verified OK snapshot was not recorded as last-good")
          PY
