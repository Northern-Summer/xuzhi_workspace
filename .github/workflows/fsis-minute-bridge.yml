name: FSIS minute bridge

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - fsis-data
    paths:
      - "fsis-bridge/**"
      - ".github/workflows/fsis-minute-bridge.yml"
      - "bridge/request.json"
  schedule:
    - cron: "*/5 1-7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: fsis-minute-bridge
  cancel-in-progress: true

env:
  DATA_BRANCH: fsis-data
  CONTROL_BRANCH: master
  PYTHONUNBUFFERED: "1"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download bridge runtime
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/Northern-Summer/xuzhi_workspace/master/fsis-bridge/fetch_minute.py --output fetch_minute.py
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/Northern-Summer/xuzhi_workspace/master/fsis-bridge/publish_bridge.py --output publish_bridge.py
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/Northern-Summer/xuzhi_workspace/master/fsis-bridge/selftest.py --output selftest.py
          python3 -m py_compile fetch_minute.py publish_bridge.py selftest.py
          python3 selftest.py

      - name: Ensure data branch exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ env.DATA_BRANCH }}
          CONTROL_BRANCH: ${{ env.CONTROL_BRANCH }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          repo=os.environ["REPO"]; token=os.environ["GH_TOKEN"]; branch=os.environ["BRANCH"]; control=os.environ["CONTROL_BRANCH"]
          headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"FSIS-Minute-Bridge/2.1"}
          def call(method,url,payload=None):
              data=json.dumps(payload).encode() if payload is not None else None
              h=dict(headers)
              if data is not None: h["Content-Type"]="application/json"
              req=urllib.request.Request(url,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e: return e.code,json.loads(e.read().decode() or "{}")
          s,b=call("GET",f"https://api.github.com/repos/{repo}/git/ref/heads/{branch}")
          if s==200:
              print(json.dumps({"data_branch":"present","sha":b.get("object",{}).get("sha")},ensure_ascii=False))
          elif s==404:
              s2,b2=call("GET",f"https://api.github.com/repos/{repo}/git/ref/heads/{control}")
              if s2!=200: raise SystemExit(f"control branch unavailable: {s2} {b2}")
              s3,b3=call("POST",f"https://api.github.com/repos/{repo}/git/refs",{"ref":f"refs/heads/{branch}","sha":b2["object"]["sha"]})
              if s3 not in (201,422): raise SystemExit(f"data branch bootstrap failed: {s3} {b3}")
              print(json.dumps({"data_branch":"created","status":s3},ensure_ascii=False))
          else:
              raise SystemExit(f"data branch inspect failed: {s} {b}")
          PY

      - name: Load FSIS runtime request from control plane
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ env.CONTROL_BRANCH }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          repo=os.environ["REPO"]; token=os.environ["GH_TOKEN"]; branch=os.environ["BRANCH"]
          url=f"https://api.github.com/repos/{repo}/contents/bridge/request.json?ref={branch}"
          req=urllib.request.Request(url,headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"FSIS-Minute-Bridge/2.1"})
          symbols=[]; request_id="default-core"; request_state="DEFAULT"; reason="no request"; spec={}
          try:
              with urllib.request.urlopen(req,timeout=15) as r: body=json.loads(r.read().decode())
              spec=json.loads(base64.b64decode(body["content"]).decode())
          except Exception as exc: reason=f"request fetch/parse failed: {exc!r}"
          now=datetime.now(ZoneInfo("Asia/Shanghai")); expires=spec.get("expires_at_bj") if isinstance(spec,dict) else None; expired=False
          if expires:
              try: expired=datetime.fromisoformat(expires)<=now
              except Exception: expired=True; reason=f"invalid expires_at_bj: {expires!r}"
          raw_symbols=spec.get("symbols") if isinstance(spec,dict) else None
          if isinstance(raw_symbols,list):
              for item in raw_symbols:
                  value=str(item).strip()
                  if value and value not in symbols: symbols.append(value)
          if symbols and not expired and len(symbols)<=25:
              request_id=str(spec.get("request_id") or "default-core"); request_state="REQUEST"; reason="valid runtime request"
          else:
              symbols=[]; request_id="default-core"; request_state="DEFAULT"
              if expired: reason="runtime request expired"
              elif isinstance(raw_symbols,list) and len(raw_symbols)>25: reason=f"runtime request exceeds 25-symbol cap: {len(raw_symbols)}"
              elif not symbols and reason=="no request": reason="runtime request contains no usable symbols"
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              f.write("FSIS_SYMBOLS="+",".join(symbols)+"\n"); f.write("FSIS_REQUEST_ID="+request_id+"\n"); f.write("FSIS_REQUEST_STATE="+request_state+"\n"); f.write("FSIS_REQUEST_REASON="+reason.replace("\n"," ")+"\n")
          print(json.dumps({"request_id":request_id,"request_state":request_state,"symbol_count":len(symbols) if symbols else "default","reason":reason},ensure_ascii=False))
          PY

      - name: Fetch 1m market data
        run: python3 fetch_minute.py

      - name: Publish snapshot and status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ env.DATA_BRANCH }}
          REQUEST_STATE: ${{ env.FSIS_REQUEST_STATE }}
          REQUEST_REASON: ${{ env.FSIS_REQUEST_REASON }}
        run: python3 publish_bridge.py

      - name: Verify published status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ env.DATA_BRANCH }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,urllib.request
          repo=os.environ["REPO"]; branch=os.environ["BRANCH"]; token=os.environ["GH_TOKEN"]
          url=f"https://api.github.com/repos/{repo}/contents/bridge/status.json?ref={branch}"
          req=urllib.request.Request(url,headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"FSIS-Minute-Bridge/2.1"})
          with urllib.request.urlopen(req,timeout=20) as r: body=json.loads(r.read().decode())
          status=json.loads(base64.b64decode(body["content"]).decode()); print(json.dumps(status,ensure_ascii=False,indent=2))
          if status.get("status") not in {"OK","PARTIAL_FAILURE","FAILED"}: raise SystemExit("invalid bridge status")
          if "published_at_utc" not in status: raise SystemExit("published status missing timestamp")
          if status.get("status")=="OK" and not status.get("last_good_snapshot_updated"): raise SystemExit("verified OK snapshot was not recorded as last-good")
          PY

      - name: Emit explicit data-state summary
        run: |
          python3 - <<'PY'
          import json
          with open("bridge/status.json","r",encoding="utf-8") as f: s=json.load(f)
          print("FSIS_DATA_STATE="+str(s.get("status"))); print("FSIS_LIVE_ELIGIBLE="+str(s.get("live_eligible"))); print("FSIS_COVERAGE="+str(s.get("coverage_ratio")))
          PY
