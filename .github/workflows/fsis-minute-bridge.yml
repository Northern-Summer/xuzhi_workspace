name: FSIS minute bridge

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - fsis-data
    paths:
      - "fsis-bridge/**"
      - ".github/workflows/fsis-minute-bridge.yml"
      - "bridge/request.json"
  schedule:
    - cron: "*/10 1-7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: fsis-minute-bridge
  cancel-in-progress: true

env:
  DATA_BRANCH: fsis-data
  CONTROL_BRANCH: master
  PYTHONUNBUFFERED: "1"
  FSIS_MINUTE_MAX_SYMBOLS: "120"
  FSIS_MINUTE_LIVE_COVERAGE: "0.80"
  FSIS_FETCH_WORKERS: "8"
  FSIS_MARKET_TIMEOUT: "5"
  FSIS_MARKET_RETRIES: "1"
  FSIS_MARKET_MAX_PAGES: "80"
  FSIS_MARKET_PAGE_WORKERS: "8"
  FSIS_MARKET_HOST_WORKERS: "4"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Validate bridge runtime
        run: |
          set -euo pipefail
          python3 -m py_compile fsis-bridge/fetch_market.py fsis-bridge/fetch_minute.py fsis-bridge/publish_bridge.py fsis-bridge/selftest.py
          python3 fsis-bridge/selftest.py
          git rev-parse HEAD

      - name: Ensure data branch exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ env.DATA_BRANCH }}
          CONTROL_BRANCH: ${{ env.CONTROL_BRANCH }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          repo=os.environ["REPO"]; token=os.environ["GH_TOKEN"]; branch=os.environ["BRANCH"]; control=os.environ["CONTROL_BRANCH"]
          headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"FSIS-Minute-Bridge/3.6"}
          def call(method,url,payload=None):
              data=json.dumps(payload).encode() if payload is not None else None
              h=dict(headers)
              if data is not None: h["Content-Type"]="application/json"
              req=urllib.request.Request(url,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e: return e.code,json.loads(e.read().decode() or "{}")
          s,b=call("GET",f"https://api.github.com/repos/{repo}/git/ref/heads/{branch}")
          if s==200:
              print(json.dumps({"data_branch":"present","sha":b.get("object",{}).get("sha")},ensure_ascii=False))
          elif s==404:
              s2,b2=call("GET",f"https://api.github.com/repos/{repo}/git/ref/heads/{control}")
              if s2!=200: raise SystemExit(f"control branch unavailable: {s2} {b2}")
              s3,b3=call("POST",f"https://api.github.com/repos/{repo}/git/refs",{"ref":f"refs/heads/{branch}","sha":b2["object"]["sha"]})
              if s3 not in (201,422): raise SystemExit(f"data branch bootstrap failed: {s3} {b3}")
              print(json.dumps({"data_branch":"created","status":s3},ensure_ascii=False))
          else:
              raise SystemExit(f"data branch inspect failed: {s} {b}")
          PY

      - name: Load FSIS runtime request from control plane
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ env.CONTROL_BRANCH }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          repo=os.environ["REPO"]; token=os.environ["GH_TOKEN"]; branch=os.environ["BRANCH"]
          url=f"https://api.github.com/repos/{repo}/contents/bridge/request.json?ref={branch}"
          req=urllib.request.Request(url,headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"FSIS-Minute-Bridge/3.6"})
          symbols=[]; request_id="default-core"; request_state="DEFAULT"; reason="no request"; spec={}
          try:
              with urllib.request.urlopen(req,timeout=15) as r: body=json.loads(r.read().decode())
              spec=json.loads(base64.b64decode(body["content"]).decode())
          except Exception as exc: reason=f"request fetch/parse failed: {exc!r}"
          now=datetime.now(ZoneInfo("Asia/Shanghai")); expires=spec.get("expires_at_bj") if isinstance(spec,dict) else None; expired=False
          if expires:
              try: expired=datetime.fromisoformat(expires)<=now
              except Exception: expired=True; reason=f"invalid expires_at_bj: {expires!r}"
          raw_symbols=spec.get("symbols") if isinstance(spec,dict) else None
          if isinstance(raw_symbols,list):
              for item in raw_symbols:
                  value=str(item).strip()
                  if value and value not in symbols: symbols.append(value)
          if symbols and not expired and len(symbols)<=120:
              request_id=str(spec.get("request_id") or "default-core"); request_state="REQUEST"; reason="valid runtime request"
          else:
              request_id="default-core"; request_state="FULL_MARKET"; reason="full-market discovery"
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              f.write("FSIS_SYMBOLS="+",".join(symbols)+"\n"); f.write("FSIS_REQUEST_ID="+request_id+"\n"); f.write("FSIS_REQUEST_STATE="+request_state+"\n"); f.write("FSIS_REQUEST_REASON="+reason.replace("\n"," ")+"\n")
          print(json.dumps({"request_id":request_id,"request_state":request_state,"symbol_count":len(symbols),"reason":reason},ensure_ascii=False))
          PY

      - name: Full-market discovery
        env:
          FSIS_EASTMONEY_UT: bd1d9ddb04089700cf9c27f6f7426281
        run: |
          set -euo pipefail
          python3 fsis-bridge/fetch_market.py
          python3 - <<'PY'
          import json, os
          with open("bridge/market.json","r",encoding="utf-8") as f: m=json.load(f)
          if m.get("live_eligible"):
              with open("bridge/generated-request.json","r",encoding="utf-8") as f: r=json.load(f)
              symbols=r.get("symbols") or []
              if symbols:
                  with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as out:
                      out.write("FSIS_SYMBOLS="+",".join(symbols)+"\n")
                      out.write("FSIS_REQUEST_ID="+str(r.get("request_id") or "full-market")+"\n")
                      out.write("FSIS_REQUEST_STATE=FULL_MARKET\n")
                      out.write("FSIS_REQUEST_REASON=validated full-market candidate generation\n")
                  print("FSIS_FULL_MARKET_UNIVERSE="+str(m.get("universe_total")))
                  print("FSIS_MINUTE_CANDIDATES="+str(len(symbols)))
              else:
                  print("::warning::full-market discovery produced no candidates")
          else:
              print("::warning::full-market discovery unavailable; retaining explicit request/default universe")
          PY

      - name: Fetch candidate 1m market data
        run: python3 fsis-bridge/fetch_minute.py

      - name: Publish market, snapshot and status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ env.DATA_BRANCH }}
          REQUEST_STATE: ${{ env.FSIS_REQUEST_STATE }}
          REQUEST_REASON: ${{ env.FSIS_REQUEST_REASON }}
        run: python3 fsis-bridge/publish_bridge.py

      - name: Verify published status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ env.DATA_BRANCH }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,urllib.request
          repo=os.environ["REPO"]; branch=os.environ["BRANCH"]; token=os.environ["GH_TOKEN"]
          headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"FSIS-Minute-Bridge/3.6"}
          def read(path):
              url=f"https://api.github.com/repos/{repo}/contents/{path}?ref={branch}"
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r: body=json.loads(r.read().decode())
              return json.loads(base64.b64decode(body["content"]).decode())
          status=read("bridge/status.json")
          market=read("bridge/market.json")
          print(json.dumps({"market":market,"minute":status},ensure_ascii=False,indent=2))
          if market.get("status") not in {"OK","PARTIAL_FAILURE","FAILED"}: raise SystemExit("invalid market status")
          if status.get("status") not in {"OK","PARTIAL_FAILURE","FAILED"}: raise SystemExit("invalid minute status")
          if status.get("status")=="OK" and not status.get("last_good_snapshot_updated"): raise SystemExit("verified OK minute snapshot was not recorded as last-good")
          PY

      - name: Emit explicit state summary
        run: |
          python3 - <<'PY'
          import json
          for path in ("bridge/market.json", "bridge/status.json"):
              with open(path,"r",encoding="utf-8") as f: s=json.load(f)
              print(path+"="+json.dumps({k:s.get(k) for k in ("status","live_eligible","universe_total","coverage_ratio","candidate_count","symbols_succeeded","symbols_failed","tradeable_live_eligible")},ensure_ascii=False))
          PY

      # Operational invariant: market-data degradation is a state, never a workflow crash.
